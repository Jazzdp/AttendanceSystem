<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #6c0be228;
        }

        /*navbar mobile first*/
        nav {
            background-color: #572E54;
            padding: 1rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 0.5rem;
            background-color: #572E54;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .container {
            padding: 1rem; /*mobile first*/
            max-width: 1200px;
            margin: 0 auto;
        }
        section {
            background: rgb(255, 255, 255);
            margin: 1rem 0; /*mobile first*/
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #333;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #333;
        }

        /* Table*/
        .table-wrapper {
            overflow-x: auto; /*mobile first*/
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        table th,
        table td {
            padding: 0.75rem;
            text-align: left;
            border: 1px solid #ddd;}
            .row-good {background-color:#06c1ab;}
            .row-warning {background-color: #f4fa96;}
            .row-warning {background-color: #810808;}
        .message-col {text-align: left;}
        .errors {color:#86041c}
       

        table th {
            background-color: #572E54;
            color: white;
            font-weight: bold;
        }

        table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        table tr:hover {
            background-color: #f0f0f0;
        }

        /* Form */
        form {
            display: flex;
            flex-direction: column; /*mobile first */
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 0.3rem;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"] {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: #572E54;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #a955a4;
        }

        /* Tablet Styles */
        @media (min-width: 768px) {
            nav ul {
                flex-direction: row;
                justify-content: space-around;
            }

            nav ul li a {
                background-color: transparent;
            }

            .container {
                padding: 2rem;
            }

            .form-group {
                flex-direction: row;
                align-items: center;
            }

            label {
                width: 150px;
                margin-bottom: 0;
            }

            input[type="text"],
            input[type="email"],
            input[type="date"] {
                flex: 1;
            }

            button {
                align-self: flex-start;
                margin-left: 150px;
            }
        }

        /* Desktop adaption */
        @media (min-width: 1024px) {
            .container {
                padding: 2rem 4rem;
            }

            table {
                min-width: auto;
            }

            section {
                padding: 2rem;
            }
        }
    </style>
</head>
